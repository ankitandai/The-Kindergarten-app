<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sorting Bin</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E0;--ink:#2B2A4C;--pink:#FF6B9D;--yellow:#FFD93D;--blue:#4ECDC4;--green:#95E06C;--orange:#FF9A3C;--purple:#B388EB;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Fredoka',sans-serif;background:var(--bg);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;min-height:100vh;background-image:radial-gradient(circle at 20% 25%,rgba(86,204,242,.18) 0%,transparent 40%),radial-gradient(circle at 80% 75%,rgba(95,224,108,.18) 0%,transparent 40%);}
.screen{display:none;flex-direction:column;align-items:center;padding:18px 14px 36px;min-height:100vh;gap:14px;}
.screen.active{display:flex;}
.topbar{display:flex;align-items:center;gap:10px;width:100%;max-width:500px;}
.back-btn{background:white;border:3px solid var(--ink);border-radius:50%;width:44px;height:44px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink);flex-shrink:0;transition:transform .1s,box-shadow .1s;font-family:inherit;}
.back-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
.home-btn{background:white;border:3px solid var(--ink);border-radius:50%;width:44px;height:44px;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink);flex-shrink:0;text-decoration:none;margin-left:auto;}
.topbar-title{font-family:'Bowlby One',sans-serif;font-size:22px;}
.big-title{font-family:'Bowlby One',sans-serif;font-size:34px;text-align:center;color:var(--blue);text-shadow:3px 3px 0 var(--ink);}
.sub{font-size:15px;font-weight:600;text-align:center;opacity:.7;}
.section-label{font-family:'Bowlby One',sans-serif;font-size:17px;text-align:center;width:100%;max-width:440px;}
.sort-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px;}
.sort-btn{border:4px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);padding:16px 18px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;transition:transform .12s,box-shadow .12s;background:white;font-family:'Fredoka',sans-serif;}
.sort-btn:hover{transform:translateY(-3px);box-shadow:4px 7px 0 var(--ink);}
.sort-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
.sort-icon{font-size:34px;flex-shrink:0;}
.sort-info{display:flex;flex-direction:column;}
.sort-name{font-family:'Bowlby One',sans-serif;font-size:18px;}
.sort-desc{font-size:13px;font-weight:600;opacity:.65;}
/* game */
.hud{display:flex;gap:12px;align-items:center;}
.score-chip{background:white;border:3px solid var(--ink);border-radius:999px;padding:5px 14px;font-family:'Bowlby One',sans-serif;font-size:15px;box-shadow:2px 2px 0 var(--ink);}
.progress-wrap{width:100%;max-width:420px;height:14px;background:#e0d4c0;border-radius:99px;border:2px solid var(--ink);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),#2F80ED);border-radius:99px;transition:width .3s;}
.item-card{background:white;border:5px solid var(--ink);border-radius:28px;box-shadow:6px 6px 0 var(--ink);padding:24px;text-align:center;width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.item-emoji{font-size:88px;line-height:1;transition:transform .2s;}
.item-emoji.pop{transform:scale(1.25);}
.item-name{font-family:'Bowlby One',sans-serif;font-size:22px;}
.feedback-bar{height:36px;display:flex;align-items:center;justify-content:center;font-family:'Bowlby One',sans-serif;font-size:18px;border-radius:99px;width:100%;max-width:320px;transition:opacity .3s;opacity:0;}
.feedback-bar.show{opacity:1;}
.feedback-bar.good{background:#dcfce7;color:#166534;}
.feedback-bar.bad{background:#fee2e2;color:#991b1b;}
.bins{display:flex;gap:10px;width:100%;max-width:440px;flex-wrap:wrap;justify-content:center;}
.bin-btn{flex:1;min-width:120px;border:4px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:18px 10px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s,box-shadow .12s;font-family:'Fredoka',sans-serif;}
.bin-btn:hover{transform:translateY(-3px);box-shadow:5px 8px 0 var(--ink);}
.bin-btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink);}
.bin-icon{font-size:36px;line-height:1;}
.bin-label{font-family:'Bowlby One',sans-serif;font-size:16px;}
/* win */
.win-title{font-family:'Bowlby One',sans-serif;font-size:34px;color:var(--blue);text-shadow:3px 3px 0 var(--ink);}
.win-emoji-big{font-size:80px;animation:bob .7s ease infinite alternate;}
@keyframes bob{to{transform:translateY(-12px);}}
.stat-row{display:flex;gap:14px;}
.stat-box{background:white;border:4px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:14px 22px;text-align:center;}
.stat-num{font-family:'Bowlby One',sans-serif;font-size:34px;color:var(--purple);}
.stat-lbl{font-size:13px;font-weight:700;color:#888;}
.play-btn{width:100%;max-width:320px;padding:15px;font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;border:4px solid var(--ink);border-radius:16px;background:var(--green);box-shadow:4px 4px 0 var(--ink);cursor:pointer;color:var(--ink);transition:transform .1s,box-shadow .1s;}
.play-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
.play-btn.alt{background:var(--yellow);}
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:999;}
</style>
</head>
<body>

<div class="screen active" id="homeScreen">
  <div class="topbar">
    <button class="back-btn" onclick="if('speechSynthesis' in window)speechSynthesis.cancel();history.back()">←</button>
    <div class="topbar-title">🗂️ Sorting Bin</div>
    <a class="home-btn" href="index.html" onclick="if('speechSynthesis' in window)speechSynthesis.cancel()">🏠</a>
  </div>
  <div class="big-title">Sorting Bin! 🗂️</div>
  <p class="sub">Sort everything into the right bin!</p>
  <div class="section-label">Pick a sort type:</div>
  <div class="sort-list" id="sortList"></div>
</div>

<div class="screen" id="gameScreen">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('homeScreen')">←</button>
    <div class="hud">
      <div class="score-chip">✅ <span id="scoreEl">0</span></div>
      <div class="score-chip"><span id="leftEl">0</span> left</div>
    </div>
  </div>
  <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="item-card">
    <div class="item-emoji" id="itemEmoji">🐶</div>
    <div class="item-name"  id="itemName">Dog</div>
  </div>
  <div class="feedback-bar" id="feedbackBar"></div>
  <div class="bins" id="binsRow"></div>
</div>

<div class="screen" id="winScreen">
  <div class="win-emoji-big">🏆</div>
  <div class="win-title">Great Sorting!</div>
  <div class="stat-row">
    <div class="stat-box"><div class="stat-num" id="winScore">0</div><div class="stat-lbl">Correct</div></div>
    <div class="stat-box"><div class="stat-num" id="winTotal">0</div><div class="stat-lbl">Total</div></div>
  </div>
  <button class="play-btn" id="playAgainBtn">Play Again! 🔁</button>
  <button class="play-btn alt" onclick="showScreen('homeScreen')">Change Sort 🔄</button>
</div>

<script>
if('speechSynthesis' in window) speechSynthesis.cancel();
window.addEventListener('beforeunload',()=>{ if('speechSynthesis' in window) speechSynthesis.cancel(); });
const SORTS = [
  {
    id:'ani_food',name:'Animals vs Food',icon:'🐾',
    desc:'Sort creatures from snacks!',
    bins:[
      {label:'Animals',icon:'🐾',color:'#95E06C'},
      {label:'Food',   icon:'🍎',color:'#FFD93D'},
    ],
    items:[
      {e:'🐶',n:'Dog',bin:0},{e:'🍎',n:'Apple',bin:1},{e:'🐱',n:'Cat',bin:0},{e:'🍕',n:'Pizza',bin:1},
      {e:'🐸',n:'Frog',bin:0},{e:'🍌',n:'Banana',bin:1},{e:'🦁',n:'Lion',bin:0},{e:'🌽',n:'Corn',bin:1},
      {e:'🐝',n:'Bee',bin:0},{e:'🍦',n:'Ice Cream',bin:1},{e:'🐠',n:'Fish',bin:0},{e:'🧁',n:'Cupcake',bin:1},
      {e:'🦋',n:'Butterfly',bin:0},{e:'🍇',n:'Grapes',bin:1},{e:'🐢',n:'Turtle',bin:0},{e:'🥕',n:'Carrot',bin:1},
    ]
  },
  {
    id:'big_small',name:'Big vs Small',icon:'🐘',
    desc:'Which is bigger?',
    bins:[
      {label:'Big',  icon:'🐘',color:'#B388EB'},
      {label:'Small',icon:'🐭',color:'#FF9A3C'},
    ],
    items:[
      {e:'🐘',n:'Elephant',bin:0},{e:'🐭',n:'Mouse',bin:1},{e:'🦁',n:'Lion',bin:0},{e:'🐝',n:'Bee',bin:1},
      {e:'🚀',n:'Rocket',bin:0},{e:'🍓',n:'Strawberry',bin:1},{e:'🏔️',n:'Mountain',bin:0},{e:'🐜',n:'Ant',bin:1},
      {e:'🚢',n:'Ship',bin:0},{e:'🌸',n:'Flower',bin:1},{e:'🦈',n:'Shark',bin:0},{e:'🐛',n:'Caterpillar',bin:1},
      {e:'🌳',n:'Tree',bin:0},{e:'🍀',n:'Clover',bin:1},{e:'🏠',n:'House',bin:0},{e:'🐞',n:'Ladybug',bin:1},
    ]
  },
  {
    id:'land_sea',name:'Land vs Sea',icon:'🌊',
    desc:'Where do they live?',
    bins:[
      {label:'On Land',icon:'🌍',color:'#95E06C'},
      {label:'In Sea', icon:'🌊',color:'#4ECDC4'},
    ],
    items:[
      {e:'🐘',n:'Elephant',bin:0},{e:'🐬',n:'Dolphin',bin:1},{e:'🦁',n:'Lion',bin:0},{e:'🦈',n:'Shark',bin:1},
      {e:'🐎',n:'Horse',bin:0},{e:'🐙',n:'Octopus',bin:1},{e:'🐓',n:'Chicken',bin:0},{e:'🐠',n:'Clownfish',bin:1},
      {e:'🐻',n:'Bear',bin:0},{e:'🦞',n:'Lobster',bin:1},{e:'🐿️',n:'Squirrel',bin:0},{e:'🐡',n:'Pufferfish',bin:1},
      {e:'🦅',n:'Eagle',bin:0},{e:'🦑',n:'Squid',bin:1},{e:'🦊',n:'Fox',bin:0},{e:'🦀',n:'Crab',bin:1},
    ]
  },
  {
    id:'ani_veh',name:'Animals vs Vehicles',icon:'🚗',
    desc:'Creatures vs machines!',
    bins:[
      {label:'Animal', icon:'🐾',color:'#FF9A3C'},
      {label:'Vehicle',icon:'🚗',color:'#56CCF2'},
    ],
    items:[
      {e:'🚗',n:'Car',bin:1},{e:'🐯',n:'Tiger',bin:0},{e:'✈️',n:'Airplane',bin:1},{e:'🐬',n:'Dolphin',bin:0},
      {e:'🚂',n:'Train',bin:1},{e:'🦊',n:'Fox',bin:0},{e:'🚁',n:'Helicopter',bin:1},{e:'🦋',n:'Butterfly',bin:0},
      {e:'🚢',n:'Ship',bin:1},{e:'🐨',n:'Koala',bin:0},{e:'🏍️',n:'Motorcycle',bin:1},{e:'🐸',n:'Frog',bin:0},
      {e:'🚀',n:'Rocket',bin:1},{e:'🦜',n:'Parrot',bin:0},{e:'🚌',n:'Bus',bin:1},{e:'🐻',n:'Bear',bin:0},
    ]
  },
  {
    id:'healthy',name:'Healthy vs Treat',icon:'🥦',
    desc:'What is good for your body?',
    bins:[
      {label:'Healthy',icon:'💪',color:'#95E06C'},
      {label:'Treat',  icon:'🍭',color:'#FF6B9D'},
    ],
    items:[
      {e:'🥦',n:'Broccoli',bin:0},{e:'🍭',n:'Lollipop',bin:1},{e:'🍎',n:'Apple',bin:0},{e:'🍩',n:'Donut',bin:1},
      {e:'🥕',n:'Carrot',bin:0},{e:'🍫',n:'Chocolate',bin:1},{e:'🍌',n:'Banana',bin:0},{e:'🍪',n:'Cookie',bin:1},
      {e:'🥛',n:'Milk',bin:0},{e:'🥤',n:'Soda',bin:1},{e:'🥗',n:'Salad',bin:0},{e:'🍟',n:'Fries',bin:1},
      {e:'🫐',n:'Blueberries',bin:0},{e:'🍰',n:'Cake',bin:1},{e:'🌽',n:'Corn',bin:0},{e:'🍬',n:'Candy',bin:1},
    ]
  },
];

let currentSort=null, deck=[], qIdx=0, score=0, busy=false;

function speakPreK(text){
  if(localStorage.getItem('kg_grade')!=='prek')return;
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.rate=0.85;u.pitch=1.1;
  speechSynthesis.speak(u);
}
function showScreen(id){
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  if(id==='homeScreen') setTimeout(()=>speakPreK('Sort everything into the right bin! Pick a sort type.'),400);
}
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}

(function buildSortList(){
  const list=document.getElementById('sortList');
  SORTS.forEach(s=>{
    const b=document.createElement('button');b.className='sort-btn';
    b.innerHTML=`<span class="sort-icon">${s.icon}</span><span class="sort-info"><span class="sort-name">${s.name}</span><span class="sort-desc">${s.desc}</span></span>`;
    b.onclick=()=>startGame(s);list.appendChild(b);
  });
  setTimeout(()=>speakPreK('Sort everything into the right bin! Pick a sort type.'),500);
})();

function startGame(sort){
  currentSort=sort;deck=shuffle([...sort.items]);qIdx=0;score=0;busy=false;
  document.getElementById('scoreEl').textContent='0';
  // build bins
  const binsRow=document.getElementById('binsRow');binsRow.innerHTML='';
  sort.bins.forEach((bin,i)=>{
    const b=document.createElement('button');b.className='bin-btn';
    b.style.background=bin.color;b.style.borderColor=bin.color.replace('ff','cc');
    b.innerHTML=`<span class="bin-icon">${bin.icon}</span><span class="bin-label">${bin.label}</span>`;
    b.onclick=()=>sortItem(i);binsRow.appendChild(b);
  });
  document.getElementById('playAgainBtn').onclick=()=>startGame(sort);
  showScreen('gameScreen');showItem();
}

function showItem(){
  if(qIdx>=deck.length){showWin();return;}
  const item=deck[qIdx];
  document.getElementById('itemEmoji').textContent=item.e;
  document.getElementById('itemName').textContent=item.n;
  document.getElementById('leftEl').textContent=deck.length-qIdx;
  document.getElementById('progressFill').style.width=`${(qIdx/deck.length)*100}%`;
  const fb=document.getElementById('feedbackBar');fb.className='feedback-bar';fb.textContent='';
}

function sortItem(binIdx){
  if(busy)return;
  const item=deck[qIdx];
  const isCorrect=binIdx===item.bin;
  busy=true;
  const fb=document.getElementById('feedbackBar');
  if(isCorrect){
    score++;document.getElementById('scoreEl').textContent=score;
    fb.textContent='✅ Correct!';fb.className='feedback-bar show good';
    const emoji=document.getElementById('itemEmoji');
    emoji.classList.add('pop');setTimeout(()=>emoji.classList.remove('pop'),200);
  } else {
    const correctBin=currentSort.bins[item.bin];
    fb.textContent=`❌ It's ${item.n} → ${correctBin.label}!`;fb.className='feedback-bar show bad';
  }
  setTimeout(()=>{qIdx++;busy=false;showItem();},isCorrect?600:1100);
}

function showWin(){
  document.getElementById('winScore').textContent=score;
  document.getElementById('winTotal').textContent=deck.length;
  if(score>=deck.length*.8)sprayConfetti();
  showScreen('winScreen');
}

function sprayConfetti(){
  const cols=['#FF6B9D','#FFD93D','#4ECDC4','#95E06C','#FF9A3C','#B388EB'];
  for(let i=0;i<50;i++){
    const el=document.createElement('div');el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}vw;top:-10px;background:${cols[i%cols.length]}`;
    document.body.appendChild(el);
    const tx=(Math.random()-.5)*300,ty=window.innerHeight+50;
    el.animate([{opacity:1,transform:'rotate(0)'},{opacity:0,transform:`translate(${tx}px,${ty}px) rotate(${Math.random()*720}deg)`}],
      {duration:1800+Math.random()*800,delay:Math.random()*500}).onfinish=()=>el.remove();
  }
}
</script>
</body>
</html>
