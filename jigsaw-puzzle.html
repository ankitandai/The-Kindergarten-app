<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jigsaw Puzzle 🧩</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E0;--ink:#2B2A4C;--pink:#FF6B9D;--yellow:#FFD93D;--blue:#4ECDC4;--green:#95E06C;--orange:#FF9A3C;--purple:#B388EB;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Fredoka',sans-serif;background:var(--bg);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{background:white;border-bottom:3px solid var(--ink);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{width:40px;height:40px;border:3px solid var(--ink);border-radius:50%;background:white;box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex-shrink:0;text-decoration:none;color:var(--ink);transition:transform .1s,box-shadow .1s;font-family:inherit;}
.icon-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
.topbar-title{font-family:'Bowlby One',sans-serif;font-size:20px;flex:1;text-align:center;}
.timer-chip{background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:'Bowlby One',sans-serif;font-size:14px;box-shadow:2px 2px 0 var(--ink);min-width:58px;text-align:center;}

/* MODEBAR */
.modebar{background:rgba(255,255,255,.9);border-bottom:2px solid rgba(43,42,76,.12);padding:7px 10px;display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;}
.mode-btn{padding:6px 12px;font-family:'Fredoka',sans-serif;font-size:13px;font-weight:700;border:3px solid var(--ink);border-radius:999px;background:white;color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s;}
.mode-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
.mode-btn.active{background:var(--ink);color:white;}
.mode-btn.peek-btn{background:#E1F5FE;color:#0277BD;}
.mode-btn.new-btn{background:var(--orange);color:white;}
.progress-chip{margin-left:auto;background:var(--purple);border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-family:'Bowlby One',sans-serif;font-size:13px;color:white;box-shadow:2px 2px 0 var(--ink);}

/* STAGE */
.stage{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px;overflow:hidden;min-height:0;}
@media(min-width:680px) and (orientation:landscape){.stage{flex-direction:row;}}

/* BOARD */
.board-wrap{flex:1.4;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;}
.board{position:relative;width:100%;max-width:100%;aspect-ratio:1/1;max-height:100%;background:white;border:4px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;margin:0 auto;}
.peek-overlay{position:absolute;inset:0;z-index:50;border-radius:12px;overflow:hidden;display:none;background:rgba(255,255,255,.06);}
.peek-overlay svg{width:100%;height:100%;display:block;}

/* TRAY */
.tray-section{flex:1;display:flex;flex-direction:column;gap:4px;min-height:0;}
.tray{flex:1;position:relative;min-height:90px;background:#FFF8E1;border:3px solid var(--yellow);border-radius:14px;overflow:hidden;box-shadow:3px 3px 0 rgba(43,42,76,.15);}
.tray-label{text-align:center;font-size:11px;font-weight:700;color:#bbb;padding:1px 0;}

/* PICKER */
.puzzle-picker{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;flex-shrink:0;scrollbar-width:none;}
.puzzle-picker::-webkit-scrollbar{display:none;}
.pick-btn{flex-shrink:0;width:52px;height:52px;border:3px solid var(--ink);border-radius:12px;background:white;cursor:pointer;overflow:hidden;box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;transition:transform .1s,box-shadow .1s;font-family:'Fredoka',sans-serif;}
.pick-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
.pick-btn.active{background:var(--yellow);}
.pick-btn svg{width:28px;height:28px;flex-shrink:0;}
.pick-btn span{font-size:8px;font-weight:700;color:var(--ink);}

/* PIECES */
.piece{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;}
.piece:hover:not(.locked){z-index:10;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25));}
.piece.dragging{cursor:grabbing;z-index:100;filter:drop-shadow(0 6px 14px rgba(0,0,0,.38));}
.piece.locked{cursor:default;pointer-events:none;}
.piece svg{width:100%;height:100%;display:block;}
.slot{position:absolute;background:rgba(179,157,219,.12);border:2px dashed rgba(43,42,76,.2);border-radius:6px;box-sizing:border-box;}

/* SNACK MESSAGE */
.snack-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:200;}
.snack-msg{background:linear-gradient(135deg,#FFD700,#FFA500);color:white;padding:10px 22px;border-radius:999px;font-family:'Bowlby One',sans-serif;font-size:17px;opacity:0;transform:scale(.5) rotate(-8deg);transition:all .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 4px 14px rgba(255,165,0,.45);white-space:nowrap;}
.snack-msg.show{opacity:1;transform:scale(1) rotate(0);}

/* WIN OVERLAY */
.win-overlay{position:absolute;inset:0;z-index:300;display:none;background:rgba(255,244,224,.95);border-radius:12px;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;}
.win-overlay.show{display:flex;}
.win-big{font-size:52px;animation:bob .7s ease infinite alternate;}
@keyframes bob{to{transform:translateY(-10px);}}
.win-title{font-family:'Bowlby One',sans-serif;font-size:24px;color:var(--pink);text-shadow:3px 3px 0 var(--ink);}
.win-time{font-family:'Bowlby One',sans-serif;font-size:15px;color:var(--ink);}
.win-btn{padding:11px 24px;font-family:'Fredoka',sans-serif;font-size:16px;font-weight:700;border:4px solid var(--ink);border-radius:999px;cursor:pointer;color:var(--ink);transition:transform .1s,box-shadow .1s;box-shadow:4px 4px 0 var(--ink);}
.win-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}

/* CONFETTI */
.cf{position:fixed;width:10px;height:10px;pointer-events:none;z-index:999;}
@keyframes cfFall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" onclick="history.back()">←</button>
  <div class="topbar-title">🧩 Jigsaw Puzzle</div>
  <div class="timer-chip" id="timerEl">0:00</div>
  <a class="icon-btn" href="index.html">🏠</a>
</div>

<div class="modebar">
  <button class="mode-btn diff-btn active" data-diff="2">2×2 Easy</button>
  <button class="mode-btn diff-btn" data-diff="3">3×3 Medium</button>
  <button class="mode-btn diff-btn" data-diff="4">4×4 Hard</button>
  <button class="mode-btn peek-btn" onclick="doPeek()">👁️ Peek</button>
  <button class="mode-btn new-btn" onclick="doNext()">🎲 New</button>
  <div class="progress-chip" id="progEl">0/0</div>
</div>

<div class="stage">
  <div class="board-wrap">
    <div class="board" id="board">
      <div class="peek-overlay" id="peekOv"></div>
      <div class="snack-wrap"><div class="snack-msg" id="snackMsg"></div></div>
      <div class="win-overlay" id="winOv">
        <div class="win-big">🎉</div>
        <div class="win-title">Puzzle Complete!</div>
        <div class="win-time" id="winTimeEl"></div>
        <button class="win-btn" style="background:var(--green)" onclick="doNext()">Next Puzzle ➡️</button>
        <button class="win-btn" style="background:var(--blue);color:white" onclick="doRestart()">Play Again 🔁</button>
      </div>
    </div>
  </div>
  <div class="tray-section">
    <div class="tray-label">Drag pieces onto the puzzle board ☝️</div>
    <div class="tray" id="tray"></div>
    <div class="puzzle-picker" id="picker"></div>
  </div>
</div>

    <rect x="14" y="25" width="9" height="13" fill="#424242" rx="2"/>
    <ellipse cx="18.5" cy="25" rx="8" ry="4.5" fill="#616161"/>
    <circle cx="18.5" cy="18" r="6" fill="white" opacity=".85"/>
    <circle cx="24" cy="11" r="4.5" fill="white" opacity=".6"/>
    <circle cx="29" cy="6" r="3" fill="white" opacity=".4"/>
    <rect x="12" y="40" width="9" height="7" fill="#81D4FA" rx="1"/>
    <rect x="26" y="40" width="9" height="7" fill="#81D4FA" rx="1"/>
    <rect x="20" y="53" width="11" height="9" fill="#81D4FA" rx="2"/>
    <rect x="62" y="59" width="12" height="8" fill="#81D4FA" rx="2"/>
    <circle cx="18" cy="76" r="9" fill="#212121"/><circle cx="18" cy="76" r="3.5" fill="#757575"/>
    <circle cx="38" cy="76" r="9" fill="#212121"/><circle cx="38" cy="76" r="3.5" fill="#757575"/>
    <circle cx="62" cy="76" r="8" fill="#212121"/><circle cx="62" cy="76" r="3" fill="#757575"/>
    <circle cx="78" cy="76" r="7" fill="#212121"/><circle cx="78" cy="76" r="2.5" fill="#757575"/>
    <circle cx="80" cy="60" r="3.5" fill="#FFEB3B"/>`},
];

// ── STATE ──
let curIdx=0, curDiff=3, placed=0, secs=0, timerIv=null, peekTO=null, audioCtx=null;

const board=document.getElementById('board');
const tray=document.getElementById('tray');
const winOv=document.getElementById('winOv');
const peekOv=document.getElementById('peekOv');
const snack=document.getElementById('snackMsg');
const progEl=document.getElementById('progEl');

// ── AUDIO ──
function getAudio(){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}return audioCtx;}
function tone(freq,dur){const ctx=getAudio();if(!ctx)return;try{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0.14,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur);}catch(e){}}
function playSnap(){tone(523,.1);setTimeout(()=>tone(784,.15),80);}
function playWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2),i*100));}

// ── TIMER ──
function startTimer(){clearInterval(timerIv);secs=0;document.getElementById('timerEl').textContent='0:00';timerIv=setInterval(()=>{secs++;const m=Math.floor(secs/60),s=String(secs%60).padStart(2,'0');document.getElementById('timerEl').textContent=`${m}:${s}`;},1000);}
function stopTimer(){clearInterval(timerIv);}

function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}

function showSnack(txt,dur=800){snack.textContent=txt;snack.classList.add('show');setTimeout(()=>snack.classList.remove('show'),dur);}

function confetti(){
  for(let i=0;i<44;i++){
    const c=document.createElement('div');c.className='cf';
    c.style.background=rand(COLORS);
    c.style.left=(4+Math.random()*92)+'vw';c.style.top='-12px';
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    c.style.animation=`cfFall ${1+Math.random()*1.5}s ease-out ${Math.random()*.5}s forwards`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),3200);
  }
}

// ── PEEK ──
window.doPeek=function(){
  if(peekTO)return;
  const a=getAudio();if(a?.state==='suspended')a.resume();
  peekOv.innerHTML=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${PUZZLES[curIdx].svg}</svg>`;
  peekOv.style.display='block';
  peekTO=setTimeout(()=>{peekOv.style.display='none';peekTO=null;},2200);
};

// ── BUILD ──
function build(idx,gridSize){
  curIdx=idx;curDiff=gridSize;placed=0;
  stopTimer();winOv.classList.remove('show');
  board.querySelectorAll('.slot,.piece,.cf').forEach(el=>el.remove());
  tray.innerHTML='';
  updateProg();

  requestAnimationFrame(()=>{
    const bs=Math.min(board.clientWidth,board.clientHeight);
    const cs=bs/gridSize;const ps=Math.floor(cs-2);
    const puz=PUZZLES[idx];const total=gridSize*gridSize;
    const pos=[];
    const ox=(board.clientWidth-bs)/2;const oy=(board.clientHeight-bs)/2;

    for(let r=0;r<gridSize;r++){
      for(let c=0;c<gridSize;c++){
        const sx=ox+c*cs+1,sy=oy+r*cs+1;
        const slot=document.createElement('div');slot.className='slot';
        slot.style.cssText=`left:${sx}px;top:${sy}px;width:${ps}px;height:${ps}px`;
        board.appendChild(slot);pos.push({r,c,sx,sy});
      }
    }

    const shuf=[...pos].sort(()=>Math.random()-.5);
    const tw=tray.clientWidth,th=tray.clientHeight;
    const cols=Math.ceil(Math.sqrt(total)),rows=Math.ceil(total/cols);
    const tps=Math.max(36,Math.min(ps,Math.floor((tw-16)/cols)-8,Math.floor((th-16)/rows)-8));
    const sx2=Math.max(8,(tw-cols*(tps+6))/2);const sy2=Math.max(8,(th-rows*(tps+6))/2);

    shuf.forEach((p,i)=>{
      const el=document.createElement('div');el.className='piece';
      const tx=sx2+(i%cols)*(tps+6),ty=sy2+Math.floor(i/cols)*(tps+6);
      el.style.cssText=`width:${tps}px;height:${tps}px;left:${tx}px;top:${ty}px`;
      el.dataset.tx=p.sx;el.dataset.ty=p.sy;
      el.dataset.bs=ps;el.dataset.ts=tps;el.dataset.inTray='1';
      const vx=(p.c/gridSize)*100,vy=(p.r/gridSize)*100,vs=100/gridSize;
      el.innerHTML=`<svg viewBox="${vx} ${vy} ${vs} ${vs}" preserveAspectRatio="none">${puz.svg}</svg>`;
      tray.appendChild(el);
      attachDrag(el);
    });
    startTimer();
  });
}

function attachDrag(piece){
  let sX,sY,oX,oY,dragging=false;

  function down(e){
    if(piece.classList.contains('locked'))return;
    e.preventDefault();
    const a=getAudio();if(a?.state==='suspended')a.resume();
    const pt=e.touches?e.touches[0]:e;dragging=true;piece.classList.add('dragging');
    const br=board.getBoundingClientRect(),pr=piece.getBoundingClientRect();
    if(piece.dataset.inTray==='1'){const bs=+piece.dataset.bs;piece.style.width=bs+'px';piece.style.height=bs+'px';}
    board.appendChild(piece);
    const nr=piece.getBoundingClientRect();const ratio=nr.width/pr.width;
    oX=pt.clientX-br.left-(pt.clientX-pr.left)*ratio;
    oY=pt.clientY-br.top-(pt.clientY-pr.top)*ratio;
    piece.style.left=oX+'px';piece.style.top=oY+'px';
    sX=pt.clientX;sY=pt.clientY;
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
    document.addEventListener('touchmove',move,{passive:false});
    document.addEventListener('touchend',up);document.addEventListener('touchcancel',up);
  }

  function move(e){if(!dragging)return;e.preventDefault();const pt=e.touches?e.touches[0]:e;
    piece.style.left=(oX+pt.clientX-sX)+'px';piece.style.top=(oY+pt.clientY-sY)+'px';}

  function up(){
    if(!dragging)return;dragging=false;piece.classList.remove('dragging');
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
    document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);
    document.removeEventListener('touchcancel',up);

    const tx=+piece.dataset.tx,ty=+piece.dataset.ty;
    const cx=parseFloat(piece.style.left),cy=parseFloat(piece.style.top);
    const dist=Math.hypot(cx-tx,cy-ty);

    if(dist < +piece.dataset.bs*0.55){
      piece.style.left=tx+'px';piece.style.top=ty+'px';
      piece.classList.add('locked');piece.dataset.inTray='0';
      placed++;playSnap();updateProg();
      const total=curDiff*curDiff;
      if(placed>=total){
        stopTimer();
        setTimeout(()=>{
          playWin();confetti();
          const m=Math.floor(secs/60),s=String(secs%60).padStart(2,'0');
          document.getElementById('winTimeEl').textContent=`⏱️ ${m}:${s}`;
          winOv.classList.add('show');
        },350);
      }else{
        showSnack(rand(ENCOUR));
      }
    }else{
      piece.dataset.inTray='1';const ts=+piece.dataset.ts;
      piece.style.width=ts+'px';piece.style.height=ts+'px';tray.appendChild(piece);
      piece.style.left=(Math.random()*Math.max(10,tray.clientWidth-ts-10)+5)+'px';
      piece.style.top=(Math.random()*Math.max(10,tray.clientHeight-ts-10)+5)+'px';
    }
  }

  piece.addEventListener('mousedown',down);
  piece.addEventListener('touchstart',down,{passive:false});
}

function updateProg(){progEl.textContent=`${placed}/${curDiff*curDiff}`;}

// ── PICKER ──
function buildPicker(){
  const p=document.getElementById('picker');
  PUZZLES.forEach((puz,idx)=>{
    const btn=document.createElement('button');btn.className='pick-btn'+(idx===0?' active':'');
    btn.innerHTML=`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${puz.svg}</svg><span>${puz.label}</span>`;
    btn.onclick=()=>{document.querySelectorAll('.pick-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');build(idx,curDiff);};
    p.appendChild(btn);
  });
}

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');build(curIdx,+btn.dataset.diff);
  });
});

window.doNext=function(){
  const n=(curIdx+1)%PUZZLES.length;
  document.querySelectorAll('.pick-btn').forEach((b,i)=>b.classList.toggle('active',i===n));
  build(n,curDiff);
};
window.doRestart=function(){build(curIdx,curDiff);};

let rTo;window.addEventListener('resize',()=>{clearTimeout(rTo);rTo=setTimeout(()=>build(curIdx,curDiff),260);});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

setTimeout(()=>{buildPicker();build(0,3);},100);
})();
</script>
