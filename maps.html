<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maps Safari 🗺️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson@3/dist/topojson.min.js"></script>
<script src="avatar-chip.js"></script>
<style>
:root{--bg:#FFF4E0;--ink:#2B2A4C;--pink:#FF6B9D;--yellow:#FFD93D;--blue:#4ECDC4;--green:#95E06C;--orange:#FF9A3C;--purple:#B388EB;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  min-height:100%;overflow-y:auto;font-family:'Fredoka',sans-serif;
  background:var(--bg);color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:32px;
  background-image:
    radial-gradient(circle at 10% 20%,rgba(255,217,61,.28) 0%,transparent 38%),
    radial-gradient(circle at 90% 80%,rgba(78,205,196,.22) 0%,transparent 42%),
    radial-gradient(circle at 50% 50%,rgba(255,107,157,.13) 0%,transparent 52%);
}
.screen{width:100%;max-width:500px;display:none;flex-direction:column;align-items:center;padding:0 16px 16px;}
.screen.active{display:flex;}

/* ── topbar ── */
.topbar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px;}
.icon-btn{
  background:white;border:3px solid var(--ink);border-radius:50%;
  width:44px;height:44px;font-size:20px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s;font-family:inherit;
}
.icon-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
.topbar-title{font-family:'Bowlby One',sans-serif;font-size:20px;}
.avatar-chip{flex-shrink:0;display:flex;align-items:center;gap:5px;background:white;border:2px solid var(--ink);border-radius:999px;padding:4px 10px 4px 4px;box-shadow:2px 2px 0 var(--ink);}
.chip-head{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#f5f5f5;}
.chip-head svg,.chip-head img{display:block;width:100%;height:100%;object-fit:contain;}
.chip-name{font-size:13px;font-weight:700;}
.score-pill{
  background:var(--yellow);border:3px solid var(--ink);border-radius:999px;
  padding:3px 16px;font-family:'Bowlby One',sans-serif;font-size:20px;
  box-shadow:3px 3px 0 var(--ink);min-width:52px;text-align:center;
}

/* ── home ── */
.home-globe{font-size:88px;line-height:1;margin:14px 0 8px;animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.home-title{font-family:'Bowlby One',sans-serif;font-size:30px;text-align:center;color:var(--pink);text-shadow:3px 3px 0 var(--ink);}
.home-sub{font-size:16px;font-weight:600;color:#999;text-align:center;margin:6px 0 4px;max-width:300px;}
.load-msg{font-size:14px;color:#bbb;margin:4px 0 18px;text-align:center;transition:opacity .5s;}
.play-btn{
  width:100%;max-width:300px;padding:18px;
  font-family:'Fredoka',sans-serif;font-size:22px;font-weight:700;
  border:4px solid var(--ink);border-radius:20px;background:var(--green);
  box-shadow:5px 5px 0 var(--ink);cursor:pointer;color:var(--ink);
  transition:transform .1s,box-shadow .1s;
}
.play-btn:active:not(:disabled){transform:translate(5px,5px);box-shadow:0 0 0 var(--ink);}
.play-btn:disabled{opacity:.4;cursor:default;}

/* ── quiz layout ── */
.cont-hint{font-size:15px;font-weight:700;color:#888;margin:2px 0 8px;display:flex;align-items:center;gap:5px;}
.map-wrap{
  width:100%;max-width:310px;aspect-ratio:1/1;
  background:white;border:4px solid var(--ink);border-radius:22px;
  box-shadow:6px 6px 0 var(--ink);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
#mapSvg{width:100%;height:100%;display:block;}

/* ── hint zone ── */
.hint-zone{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0 2px;}
.hint-btn{
  background:var(--yellow);border:3px solid var(--ink);border-radius:999px;
  padding:5px 18px;font-family:'Fredoka',sans-serif;font-size:15px;font-weight:700;
  cursor:pointer;box-shadow:2px 2px 0 var(--ink);transition:transform .1s,box-shadow .1s;
  color:var(--ink);
}
.hint-btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);}
.hint-btn:disabled{opacity:.45;cursor:default;}
.hint-bubble{
  background:#fffde7;border:2px solid #f5c518;border-radius:14px;
  padding:8px 14px;font-size:14px;font-weight:600;text-align:center;
  max-width:320px;box-shadow:2px 2px 0 rgba(0,0,0,.1);
  animation:fadeUp .3s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ── options ── */
.q-label{font-size:13px;font-weight:700;color:#bbb;margin:6px 0 6px;text-transform:uppercase;letter-spacing:.5px;}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;}
.opt-btn{
  border:4px solid var(--ink);border-radius:18px;box-shadow:4px 4px 0 var(--ink);
  cursor:pointer;padding:11px 8px;background:white;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform .1s,box-shadow .1s;
}
.opt-btn:active:not([disabled]){transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
.opt-flag{font-size:26px;line-height:1;}
.opt-name{font-family:'Bowlby One',sans-serif;font-size:12px;line-height:1.25;text-align:center;}
.opt-btn.correct{background:var(--green)!important;border-color:var(--ink)!important;}
.opt-btn.wrong{background:#ffb3b3!important;border-color:#e74c3c!important;}

/* ── info panel (slide-up sheet) ── */
.panel-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.38);
  z-index:88;display:none;cursor:pointer;
}
.panel-overlay.show{display:block;}
.info-panel{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%) translateY(102%);
  width:100%;max-width:500px;
  background:white;border-top:4px solid var(--ink);
  border-radius:28px 28px 0 0;box-shadow:0 -6px 28px rgba(0,0,0,.18);
  padding:10px 20px 32px;z-index:89;
  transition:transform .45s cubic-bezier(.34,1.08,.64,1);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.info-panel.show{transform:translateX(-50%) translateY(0);}
.panel-handle{width:44px;height:5px;background:#ddd;border-radius:999px;margin-bottom:4px;}
.panel-header{
  width:100%;display:flex;align-items:center;gap:14px;
  padding-bottom:10px;border-bottom:2px solid #f0f0f0;
}
.panel-flag{font-size:52px;line-height:1;}
.panel-name{font-family:'Bowlby One',sans-serif;font-size:24px;line-height:1.1;}
.panel-result{font-size:16px;font-weight:700;margin-top:3px;}
.panel-result.ok {color:#27ae60;}
.panel-result.bad{color:#e74c3c;}
.facts-grid{width:100%;display:flex;flex-direction:column;gap:7px;}
.fact-row{
  display:flex;align-items:center;gap:10px;
  background:#fafafa;border-radius:12px;padding:8px 12px;
}
.fact-icon{font-size:20px;width:26px;text-align:center;flex-shrink:0;}
.fact-label{font-size:13px;font-weight:700;color:#aaa;width:58px;flex-shrink:0;}
.fact-val{font-size:15px;font-weight:600;color:var(--ink);}
.panel-known{
  width:100%;background:linear-gradient(135deg,#fff9e6,#fff0f5);
  border:2px solid #ffd93d;border-radius:14px;
  padding:10px 14px;font-size:14px;font-weight:600;color:var(--ink);
  text-align:center;line-height:1.5;
}
.next-btn{
  width:100%;max-width:300px;padding:14px;
  font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;
  border:4px solid var(--ink);border-radius:16px;background:var(--green);
  box-shadow:4px 4px 0 var(--ink);cursor:pointer;color:var(--ink);
  transition:transform .1s,box-shadow .1s;
}
.next-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}

/* ── celebration ── */
#celebEl{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  pointer-events:none;z-index:100;opacity:0;transition:opacity .25s;
}
#celebEl.show{opacity:1;}
.celeb-em{font-size:90px;animation:popIn .35s cubic-bezier(.36,.07,.19,.97);}
.celeb-tx{font-family:'Bowlby One',sans-serif;font-size:32px;color:var(--pink);text-shadow:3px 3px 0 var(--ink);margin-top:8px;}
@keyframes popIn{0%{transform:scale(.3)rotate(-15deg)}70%{transform:scale(1.15)rotate(3deg)}100%{transform:scale(1)}}
.confetti-piece{position:fixed;top:-10px;pointer-events:none;z-index:200;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh)rotate(720deg);opacity:0;}}
</style>
</head>

<!-- ══ HOME ══ -->
<div class="screen active" id="homeScreen">
  <div class="topbar">
    <button class="icon-btn" onclick="history.back()">←</button>
    <div class="topbar-title">Maps Safari</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <a class="icon-btn" href="index.html" style="text-decoration:none">🏠</a>
      <div class="avatar-chip"><div class="chip-head" id="chipHead"></div><span class="chip-name" id="chipName"></span></div>
    </div>
  </div>

  <div class="home-title">Maps Safari!</div>
  <p class="home-sub">Look at the country shape — can you name it?</p>
  <p class="load-msg" id="loadMsg">Loading map data…</p>
  <button class="play-btn" id="playBtn" onclick="startGame()" disabled>Let's Explore! 🌍</button>
</div>

<!-- ══ QUIZ ══ -->
<div class="screen" id="quizScreen">
  <div class="topbar">
    <button class="icon-btn" onclick="goHome()">←</button>
    <div class="topbar-title">🗺️ Maps</div>
    <div class="score-pill" id="scoreEl">0</div>
  </div>

  <div class="hint-zone">
    <button class="hint-btn" id="hintBtn" onclick="showHint()">💡 Hint?</button>
    <div class="hint-bubble" id="hintBubble" style="display:none"></div>
  </div>
  <div class="q-label">Which country is this?</div>
  <div class="opts-grid" id="optsGrid"></div>
</div>

<!-- ══ INFO PANEL ══ -->
<div class="panel-overlay" id="panelOverlay" onclick="nextRound()"></div>
<div class="info-panel" id="infoPanel">
  <div class="panel-handle"></div>
  <div class="panel-header">
    <div class="panel-flag" id="panelFlag">🇮🇳</div>

  <div class="facts-grid">

    <div class="fact-row"><span class="fact-icon">🐾</span><span class="fact-label">Animal</span><span class="fact-val" id="fAnimal">—</span></div>
    <div class="fact-row"><span class="fact-icon">🐦</span><span class="fact-label">Bird</span><span class="fact-val" id="fBird">—</span></div>
    <div class="fact-row"><span class="fact-icon">🏆</span><span class="fact-label">Sport</span><span class="fact-val" id="fSport">—</span></div>
  </div>
  <div class="panel-known" id="panelKnown"></div>
  <button class="next-btn" onclick="nextRound()">Next Country →</button>
</div>

<!-- ══ CELEBRATION ══ -->
<div id="celebEl">
  <div class="celeb-em">🎉</div>
  <div class="celeb-tx" id="celebTx">Brilliant!</div>
</div>

/* difficulty tiers
   1 = Easy   — very large or instantly recognisable shapes
   2 = Medium — distinctive but require some geography knowledge
   3 = Hard   — small, thin, or easy to confuse with neighbours   */
const DIFF={
  643:1, 36:1, 840:1, 124:1, 76:1, 156:1, 356:1, 32:1,          // tier 1 (8)
  152:2, 380:2, 392:2, 826:2, 250:2, 276:2, 724:2, 578:2, 752:2, // tier 2
  484:2, 170:2, 604:2, 792:2, 704:2, 818:2, 710:2, 504:2, 404:2,
  566:2, 231:2, 682:2, 616:2, 804:2,  68:2, 218:2, 862:2, 524:2,
  764:2, 554:2, 352:2, 642:2, 300:2, 246:2, 372:2,               // (34)
};
function getDiff(c){ return DIFF[c.id]||3; }

/* reorder array so no two adjacent entries share the same continent */
function spread(arr){
  const src=[...arr], out=[];
  let last=null;
  while(src.length){
    const idx=src.findIndex(c=>c.cont!==last);
    const pick=idx===-1?src.splice(0,1)[0]:src.splice(idx,1)[0];
    out.push(pick);
    last=pick.cont;
  }
  return out;
}

function buildDeck(){
  const t1=shuffle(validDeck.filter(c=>getDiff(c)===1));
  const t2=shuffle(validDeck.filter(c=>getDiff(c)===2));
  const t3=shuffle(validDeck.filter(c=>getDiff(c)===3));
  return [...spread(t1),...spread(t2),...spread(t3)];
}

let featById={}, validDeck=[], deck=[], qIdx=0, score=0, busy=false;
let currentQ=null, hintIdx=0;

function shuffle(a){
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world=>{
  const fc=topojson.feature(world,world.objects.countries);
  fc.features.forEach(f=>{ featById[f.id]=f; });
  validDeck=COUNTRIES.filter(c=>featById[c.id]);
  const msg=document.getElementById('loadMsg');
  msg.textContent='Map ready! ✅';
  setTimeout(()=>{ msg.style.opacity='0'; },900);
  document.getElementById('playBtn').disabled=false;
}).catch(()=>{
  document.getElementById('loadMsg').textContent='No internet? Maps need a connection.';
});

/* ── game flow ── */
function startGame(){
  deck=buildDeck();
  qIdx=0; score=0; busy=false;
  document.getElementById('scoreEl').textContent='0';
  showScreen('quizScreen');
  nextQ();
}

function nextQ(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(qIdx>=deck.length){ deck=buildDeck(); qIdx=0; }
  currentQ=deck[qIdx++];
  hintIdx=0; busy=false;

  const hintBubble=document.getElementById('hintBubble');
  const hintBtn=document.getElementById('hintBtn');
  hintBubble.style.display='none';
  hintBtn.textContent='💡 Hint?';
  hintBtn.disabled=false;

  document.getElementById('contHint').textContent=
    `${GLOB_EMOJI[currentQ.cont]} ${currentQ.cont}`;
  drawCountry(currentQ);
  buildOptions(currentQ);
}

/* ── speech ── */
function speak(text){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.rate=0.88;
  utt.pitch=1.1;
  speechSynthesis.speak(utt);
}

/* ── hint ── */
function showHint(){
  if(!currentQ||hintIdx>=currentQ.hints.length) return;
  const text=currentQ.hints[hintIdx];
  const bubble=document.getElementById('hintBubble');
  bubble.textContent=text;
  bubble.style.display='block';
  speak(text);
  hintIdx++;
  const btn=document.getElementById('hintBtn');
  if(hintIdx>=currentQ.hints.length){
    btn.textContent='💡 No more hints';
    btn.disabled=true;
  } else {
    btn.textContent='💡 One more?';
  }
}

/* ── draw country ── */
function drawCountry(q){
  const feature=featById[q.id];
  const W=280, H=280;
  const proj=d3.geoMercator().fitSize([W-20, H-20], feature);
  const path=d3.geoPath().projection(proj);
  const svg=d3.select('#mapSvg');
  svg.attr('viewBox',`0 0 ${W} ${H}`).selectAll('*').remove();
  svg.append('g').attr('transform','translate(10,10)')
    .append('path')
    .datum(feature)
    .attr('d', path)
    .attr('fill','#FF6B9D')
    .attr('stroke','#2B2A4C')
    .attr('stroke-width', 2)
    .attr('stroke-linejoin','round');
}

/* ── options ── */
function buildOptions(q){
  const grid=document.getElementById('optsGrid');
  grid.innerHTML='';
  const sameCont=shuffle(validDeck.filter(c=>c.id!==q.id && c.cont===q.cont));
  const other   =shuffle(validDeck.filter(c=>c.id!==q.id && c.cont!==q.cont));
  const distract=[...sameCont,...other].slice(0,3);
  shuffle([q,...distract]).forEach(c=>{
    const btn=document.createElement('button');
    btn.className='opt-btn';
    btn.dataset.cid=c.id;
    btn.innerHTML=`<div class="opt-flag">${c.flag}</div><div class="opt-name">${c.name}</div>`;
    btn.onclick=()=>onAnswer(btn, c.id, q.id);
    grid.appendChild(btn);
  });
}

/* ── answer ── */
function onAnswer(btn, chosen, correct){
  if(busy) return;
  busy=true;
  document.getElementById('hintBtn').disabled=true;
  const grid=document.getElementById('optsGrid');
  Array.from(grid.children).forEach(b=>{ b.disabled=true; b.onclick=null; });

  const isCorrect=chosen===correct;
  btn.classList.add(isCorrect?'correct':'wrong');
  if(!isCorrect){
    Array.from(grid.children).forEach(b=>{
      if(+b.dataset.cid===correct) b.classList.add('correct');
    });
  } else {
    score++;
    document.getElementById('scoreEl').textContent=score;
    sprayConfetti();
    showCeleb(PRAISE[Math.floor(Math.random()*PRAISE.length)]);
  }

  const delay=isCorrect?1400:900;
  setTimeout(()=>{
    hideCeleb();
    showInfoPanel(currentQ, isCorrect);
  }, delay);
}

/* ── info panel ── */
function showInfoPanel(q, wasCorrect){
  document.getElementById('panelFlag').textContent=q.flag;
  document.getElementById('panelName').textContent=q.name;
  const res=document.getElementById('panelResult');
  res.textContent=wasCorrect?'✅ Correct!':'❌ Not quite — now you know!';
  res.className='panel-result '+(wasCorrect?'ok':'bad');
  document.getElementById('fCapital').textContent=q.capital;
  document.getElementById('fAnimal').textContent=q.animal;
  document.getElementById('fBird').textContent=q.bird;
  document.getElementById('fSport').textContent=q.sport;
  document.getElementById('panelKnown').textContent=`✨ Known for: ${q.knownFor}`;
  document.getElementById('infoPanel').classList.add('show');
  document.getElementById('panelOverlay').classList.add('show');
}

function nextRound(){
  document.getElementById('infoPanel').classList.remove('show');
  document.getElementById('panelOverlay').classList.remove('show');
  setTimeout(nextQ, 460);
}

/* ── celebration ── */
function showCeleb(txt){
  document.getElementById('celebTx').textContent=txt;
  document.getElementById('celebEl').classList.add('show');
}
function hideCeleb(){ document.getElementById('celebEl').classList.remove('show'); }

function sprayConfetti(){
  const colors=['#FF6B9D','#FFD93D','#4ECDC4','#95E06C','#FF9A3C','#B388EB'];
  const shapes=['●','■','▲','★'];
  for(let i=0;i<22;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.textContent=shapes[Math.floor(Math.random()*shapes.length)];
    p.style.cssText=
      `left:${Math.random()*100}%;`+
      `font-size:${12+Math.random()*14}px;`+
      `color:${colors[Math.floor(Math.random()*colors.length)]};`+
      `animation-duration:${0.9+Math.random()*0.8}s;`+
      `animation-delay:${Math.random()*0.25}s`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 2000);
  }
}

/* ── navigation ── */
function goHome(){
  document.getElementById('infoPanel').classList.remove('show');
  document.getElementById('panelOverlay').classList.remove('show');
  showScreen('homeScreen');
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

initAvatarChip(document.getElementById('chipHead'),document.getElementById('chipName'));
</script>
