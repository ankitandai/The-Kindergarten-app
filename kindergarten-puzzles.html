<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Puzzle Time! 🧩</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  body {
    background: linear-gradient(135deg, #FFE5B4 0%, #FFCCEA 50%, #B5E5FF 100%);
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  /* HEADER */
  .header {
    padding: 12px 16px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    border-bottom: 2px solid rgba(255,255,255,0.5);
  }
  .title {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 800;
    margin: 0;
    color: #6B2D8C;
    letter-spacing: -0.5px;
  }
  .title-emoji { font-size: 1.2em; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    font-size: clamp(13px, 2.5vw, 15px);
    font-weight: 700;
    padding: 8px 14px;
    border: 3px solid #6B2D8C;
    border-radius: 999px;
    background: white;
    color: #6B2D8C;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    font-family: inherit;
  }
  .btn:hover { background: #F5E6FF; }
  .btn:active { transform: scale(0.95); }
  .btn.active {
    background: #6B2D8C;
    color: white;
  }
  .btn.shuffle {
    background: #FFC107;
    border-color: #F57C00;
    color: #5D4037;
  }
  .btn.shuffle:hover { background: #FFD54F; }

  /* MAIN STAGE */
  .stage {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
    gap: 10px;
    padding: 10px;
    overflow: hidden;
    min-height: 0;
  }
  @media (min-width: 700px) and (orientation: landscape) {
    .stage {
      grid-template-columns: 1.3fr 1fr;
      grid-template-rows: 1fr;
    }
  }

  .panel {
    background: rgba(255,255,255,0.8);
    border-radius: 20px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(107, 45, 140, 0.1);
  }
  .panel-label {
    font-size: 14px;
    font-weight: 700;
    color: #6B2D8C;
    margin-bottom: 6px;
    text-align: center;
  }

  .board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .board {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    max-height: 100%;
    background: white;
    border-radius: 16px;
    border: 4px dashed #B39DDB;
    overflow: hidden;
    margin: 0 auto;
  }

  .tray-wrap { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .tray {
    position: relative;
    flex: 1;
    min-height: 140px;
    background: #FFF8E1;
    border-radius: 16px;
    border: 3px solid #FFD54F;
    overflow: hidden;
  }

  .piece {
    position: absolute;
    cursor: grab;
    touch-action: none;
    transition: box-shadow 0.15s, transform 0.15s;
    user-select: none;
  }
  .piece:hover { transform: scale(1.05); z-index: 10; }
  .piece.dragging {
    cursor: grabbing;
    z-index: 100;
    transform: scale(1.1);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
  }
  .piece.locked {
    cursor: default;
    pointer-events: none;
    transform: none !important;
  }
  .piece svg {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.9);
    box-sizing: border-box;
  }
  .piece.locked svg {
    border-color: rgba(255,255,255,0.3);
  }

  .slot {
    position: absolute;
    background: rgba(179, 157, 219, 0.15);
    border: 2px dashed rgba(107, 45, 140, 0.25);
    border-radius: 8px;
    box-sizing: border-box;
  }

  /* PICKER */
  .picker {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 8px;
  }
  @media (max-width: 500px) {
    .picker { grid-template-columns: repeat(3, 1fr); }
  }
  .picker-btn {
    padding: 8px 4px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 12px;
    border: 3px solid transparent;
    background: white;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    color: #6B2D8C;
    font-family: inherit;
    transition: transform 0.15s;
  }
  .picker-btn:active { transform: scale(0.95); }
  .picker-btn.active {
    border-color: #6B2D8C;
    background: #F5E6FF;
  }
  .picker-icon { font-size: 24px; }

  /* CELEBRATION */
  .celebrate {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 200;
  }
  .celebrate-msg {
    background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
    color: white;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 800;
    opacity: 0;
    transform: scale(0.5) rotate(-10deg);
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 6px 20px rgba(255, 165, 0, 0.5);
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    white-space: nowrap;
  }
  .celebrate-msg.show {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

  /* CONFETTI */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    pointer-events: none;
    animation: confetti-fall 2s ease-out forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(400px) rotate(720deg); opacity: 0; }
  }

  .status {
    text-align: center;
    font-size: 13px;
    color: #6B2D8C;
    font-weight: 600;
    margin-top: 6px;
    min-height: 18px;
  }

  /* PARENT GATE OVERLAY */
  .gate-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }
  .gate-overlay.show { display: flex; }
  .gate-box {
    background: white;
    border-radius: 20px;
    padding: 28px;
    max-width: 320px;
    width: 90%;
    text-align: center;
  }
  .gate-box h2 { margin: 0 0 8px; color: #6B2D8C; }
  .gate-box p { color: #555; font-size: 14px; }
  .gate-question { font-size: 22px; font-weight: 700; margin: 16px 0; }
  .gate-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .gate-options button { padding: 12px; font-size: 18px; font-weight: 700; }
  .gate-error { color: #D32F2F; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>

<div class="header">
  <h1 class="title"><span class="title-emoji">🧩</span> Puzzle Time!</h1>
  <div class="controls">
    <button class="btn diff-btn" data-diff="2">Easy</button>
    <button class="btn diff-btn active" data-diff="3">Medium</button>
    <button class="btn diff-btn" data-diff="4">Hard</button>
    <button class="btn shuffle" id="shuffle-btn">🎲 New</button>
  </div>
</div>

        <polygon points="60,55 70,70 60,65" fill="#D32F2F"/>

  const ENCOURAGEMENTS = ['Nice!', 'You got it!', 'Yay!', 'Great!', 'Awesome!', 'Wow!', 'Wonderful!', 'Super!', 'Brilliant!'];
  const COMPLETIONS = ['You did it! 🎉', 'All done! ⭐', 'Amazing! 🌟', 'Puzzle complete! 🎊', 'Fantastic! 🏆'];
  const CONFETTI_COLORS = ['#FFD700', '#FF6B6B', '#4ECDC4', '#95E1D3', '#F38181', '#AA96DA', '#FCBAD3'];

  let currentDiff = 3;
  let currentPuzzle = 'sun';
  let pieces = [];
  let placedCount = 0;
  let audioCtx = null;

  // ============ AUDIO (Web Audio API tones) ============
  function getAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    return audioCtx;
  }
  function playTone(freq, duration, type) {
    const ctx = getAudio();
    if (!ctx) return;
    try {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }
  function playSnap() {
    playTone(523, 0.1);
    setTimeout(() => playTone(784, 0.15), 80);
  }
  function playWin() {
    [523, 659, 784, 1047].forEach((f, i) => {
      setTimeout(() => playTone(f, 0.2), i * 100);
    });
  }

  function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function showMessage(text, duration) {
    msg.textContent = text;
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), duration || 1000);
  }

  function fireConfetti() {
    const boardRect = board.getBoundingClientRect();
    const centerX = boardRect.width / 2;
    const centerY = boardRect.height / 2;
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.background = rand(CONFETTI_COLORS);
      c.style.left = (centerX + (Math.random() - 0.5) * 100) + 'px';
      c.style.top = centerY + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      c.style.animationDelay = (Math.random() * 0.3) + 's';
      c.style.transform = `rotate(${Math.random() * 360}deg)`;
      board.appendChild(c);
      setTimeout(() => c.remove(), 2500);
    }
  }

  function buildPuzzle(puzzleKey, gridSize) {
    currentPuzzle = puzzleKey;
    currentDiff = gridSize;
    placedCount = 0;
    pieces = [];

    // Clear (keep celebrate div)
    board.querySelectorAll('.slot, .piece, .confetti').forEach(s => s.remove());
    tray.innerHTML = '';

    // Wait a frame for any layout
    requestAnimationFrame(() => {
      const boardSize = Math.min(board.clientWidth, board.clientHeight);
      const cellSize = boardSize / gridSize;
      const pieceSize = Math.floor(cellSize - 2);

      const puzzle = PUZZLES[puzzleKey];
      const totalPieces = gridSize * gridSize;
      const piecePositions = [];

      // Center the grid in the board
      const offsetX = (board.clientWidth - boardSize) / 2;
      const offsetY = (board.clientHeight - boardSize) / 2;

      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
          const slotX = offsetX + col * cellSize + 1;
          const slotY = offsetY + row * cellSize + 1;

          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.style.left = slotX + 'px';
          slot.style.top = slotY + 'px';
          slot.style.width = pieceSize + 'px';
          slot.style.height = pieceSize + 'px';
          board.appendChild(slot);

          piecePositions.push({ row, col, slotX, slotY });
        }
      }

      const shuffled = [...piecePositions].sort(() => Math.random() - 0.5);

      const trayWidth = tray.clientWidth;
      const trayHeight = tray.clientHeight;
      const cols = Math.ceil(Math.sqrt(totalPieces));
      const rows = Math.ceil(totalPieces / cols);
      const maxByCol = Math.floor((trayWidth - 16) / cols) - 8;
      const maxByRow = Math.floor((trayHeight - 16) / rows) - 8;
      const trayPieceSize = Math.max(36, Math.min(pieceSize, maxByCol, maxByRow));
      const totalGridW = cols * (trayPieceSize + 6);
      const totalGridH = rows * (trayPieceSize + 6);
      const startX = Math.max(8, (trayWidth - totalGridW) / 2);
      const startY = Math.max(8, (trayHeight - totalGridH) / 2);

      shuffled.forEach((p, idx) => {
        const piece = document.createElement('div');
        piece.className = 'piece';
        piece.style.width = trayPieceSize + 'px';
        piece.style.height = trayPieceSize + 'px';
        const tx = startX + (idx % cols) * (trayPieceSize + 6);
        const ty = startY + Math.floor(idx / cols) * (trayPieceSize + 6);
        piece.style.left = tx + 'px';
        piece.style.top = ty + 'px';
        piece.dataset.row = p.row;
        piece.dataset.col = p.col;
        piece.dataset.targetX = p.slotX;
        piece.dataset.targetY = p.slotY;
        piece.dataset.boardSize = pieceSize;
        piece.dataset.traySize = trayPieceSize;
        piece.dataset.inTray = '1';

        const viewX = (p.col / gridSize) * 100;
        const viewY = (p.row / gridSize) * 100;
        const viewSize = 100 / gridSize;
        piece.innerHTML = `<svg viewBox="${viewX} ${viewY} ${viewSize} ${viewSize}" preserveAspectRatio="none">${puzzle.svg}</svg>`;

        tray.appendChild(piece);
        pieces.push(piece);
        attachDrag(piece);
      });

      status.textContent = `Place ${totalPieces} pieces!`;
    });
  }

  function attachDrag(piece) {
    let startX, startY, origX, origY, dragging = false;

    function onDown(e) {
      if (piece.classList.contains('locked')) return;
      e.preventDefault();
      // Resume audio context on first interaction
      const ctx = getAudio();
      if (ctx && ctx.state === 'suspended') ctx.resume();

      const point = e.touches ? e.touches[0] : e;
      dragging = true;
      piece.classList.add('dragging');

      const boardRect = board.getBoundingClientRect();
      const pieceRect = piece.getBoundingClientRect();

      if (piece.dataset.inTray === '1') {
        const targetSize = parseFloat(piece.dataset.boardSize);
        piece.style.width = targetSize + 'px';
        piece.style.height = targetSize + 'px';
      }

      board.appendChild(piece);
      const newPieceRect = piece.getBoundingClientRect();
      const sizeRatio = newPieceRect.width / pieceRect.width;
      const cursorOffsetX = point.clientX - pieceRect.left;
      const cursorOffsetY = point.clientY - pieceRect.top;
      const newCursorX = cursorOffsetX * sizeRatio;
      const newCursorY = cursorOffsetY * sizeRatio;

      origX = point.clientX - boardRect.left - newCursorX;
      origY = point.clientY - boardRect.top - newCursorY;
      piece.style.left = origX + 'px';
      piece.style.top = origY + 'px';

      startX = point.clientX;
      startY = point.clientY;

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('touchend', onUp);
      document.addEventListener('touchcancel', onUp);
    }

    function onMove(e) {
      if (!dragging) return;
      e.preventDefault();
      const point = e.touches ? e.touches[0] : e;
      const dx = point.clientX - startX;
      const dy = point.clientY - startY;
      piece.style.left = (origX + dx) + 'px';
      piece.style.top = (origY + dy) + 'px';
    }

    function onUp() {
      if (!dragging) return;
      dragging = false;
      piece.classList.remove('dragging');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onUp);
      document.removeEventListener('touchcancel', onUp);

      const targetX = parseFloat(piece.dataset.targetX);
      const targetY = parseFloat(piece.dataset.targetY);
      const currentX = parseFloat(piece.style.left);
      const currentY = parseFloat(piece.style.top);
      const dist = Math.sqrt(Math.pow(currentX - targetX, 2) + Math.pow(currentY - targetY, 2));

      const snapThreshold = parseFloat(piece.dataset.boardSize) * 0.55;

      if (dist < snapThreshold) {
        piece.style.left = targetX + 'px';
        piece.style.top = targetY + 'px';
        piece.classList.add('locked');
        piece.dataset.inTray = '0';
        placedCount++;
        playSnap();
        showMessage(rand(ENCOURAGEMENTS), 700);

        const total = currentDiff * currentDiff;
        if (placedCount >= total) {
          setTimeout(() => {
            playWin();
            fireConfetti();
            showMessage(rand(COMPLETIONS), 2500);
            status.textContent = 'Tap 🎲 New for another puzzle!';
          }, 300);
        } else {
          status.textContent = `${placedCount} of ${total} placed`;
        }
      } else {
        piece.dataset.inTray = '1';
        const traySize = parseFloat(piece.dataset.traySize);
        piece.style.width = traySize + 'px';
        piece.style.height = traySize + 'px';
        tray.appendChild(piece);
        const trayW = tray.clientWidth;
        const trayH = tray.clientHeight;
        piece.style.left = (Math.random() * Math.max(10, trayW - traySize - 10) + 5) + 'px';
        piece.style.top = (Math.random() * Math.max(10, trayH - traySize - 10) + 5) + 'px';
      }
    }

    piece.addEventListener('mousedown', onDown);
    piece.addEventListener('touchstart', onDown, { passive: false });
  }

  function buildPicker() {
    picker.innerHTML = '';
    Object.keys(PUZZLES).forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'picker-btn';
      btn.dataset.puzzle = key;
      btn.innerHTML = `<span class="picker-icon">${PUZZLES[key].icon}</span><span>${PUZZLES[key].label}</span>`;
      if (key === currentPuzzle) btn.classList.add('active');
      btn.addEventListener('click', () => {
        document.querySelectorAll('.picker-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        buildPuzzle(key, currentDiff);
      });
      picker.appendChild(btn);
    });
  }

  // Difficulty
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildPuzzle(currentPuzzle, parseInt(btn.dataset.diff));
    });
  });

  // Shuffle
  document.getElementById('shuffle-btn').addEventListener('click', () => {
    const keys = Object.keys(PUZZLES).filter(k => k !== currentPuzzle);
    const next = rand(keys);
    document.querySelectorAll('.picker-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.puzzle === next);
    });
    buildPuzzle(next, currentDiff);
  });

  // Handle window resize - rebuild on significant changes
  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      buildPuzzle(currentPuzzle, currentDiff);
    }, 250);
  });

  // Prevent unwanted gestures on iOS
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  // Initial build
  setTimeout(() => {
    buildPicker();
    buildPuzzle('sun', 3);
  }, 100);
})();
</script>
</body>
</html>
